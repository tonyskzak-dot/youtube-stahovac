<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube to MP3 & MP4 Converter</title>
    <style>
        :root {
            --bg: #0f0f0f;
            --card: #1a1a1a;
            --accent: #cc0000;
            --accent-hover: #e60000;
            --text: #ffffff;
            --muted: #aaaaaa;
            --border: #333333;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 16px;
            box-sizing: border-box;
        }
        .container {
            background: var(--card);
            padding: 2.5rem 2rem;
            border-radius: 12px;
            width: 100%;
            max-width: 480px;
            box-shadow: 0 12px 32px rgba(0,0,0,0.8);
            border: 1px solid var(--border);
        }
        .logo {
            text-align: center;
            font-size: 1.6rem;
            font-weight: 800;
            margin-bottom: 0.2rem;
            letter-spacing: -0.5px;
        }
        .logo span {
            color: var(--accent);
        }
        .subtitle {
            text-align: center;
            color: var(--muted);
            font-size: 0.85rem;
            margin-bottom: 2rem;
        }
        .tabs {
            display: flex;
            background: #111;
            border-radius: 8px;
            padding: 4px;
            margin-bottom: 1.5rem;
            border: 1px solid var(--border);
        }
        .tab {
            flex: 1;
            text-align: center;
            padding: 10px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.9rem;
            border-radius: 6px;
            color: var(--muted);
            transition: all 0.2s;
        }
        .tab.active {
            background: var(--accent);
            color: #fff;
        }
        .form-group {
            margin-bottom: 1.25rem;
        }
        label {
            display: block;
            margin-bottom: 6px;
            font-size: 0.85rem;
            color: var(--muted);
            font-weight: 500;
        }
        input, select {
            width: 100%;
            padding: 12px 14px;
            border-radius: 8px;
            border: 1px solid var(--border);
            background: #121212;
            color: var(--text);
            box-sizing: border-box;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s;
        }
        input:focus, select:focus {
            border-color: var(--accent);
        }
        .btn {
            width: 100%;
            padding: 14px;
            background: var(--accent);
            color: #fff;
            font-weight: 700;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1rem;
            transition: background 0.2s, transform 0.1s;
            margin-top: 0.5rem;
        }
        .btn:hover {
            background: var(--accent-hover);
        }
        .btn:active {
            transform: scale(0.98);
        }
        .btn:disabled {
            background: #444;
            cursor: not-allowed;
            transform: none;
        }
        #status {
            text-align: center;
            font-size: 0.9rem;
            margin-top: 15px;
            color: var(--muted);
            word-break: break-all;
            line-height: 1.4;
        }
        .options { display: none; }
        .options.active { display: block; }
    </style>
</head>
<body>

    <div class="container">
        <div class="logo">YouTube<span>ToMP3</span></div>
        <div class="subtitle">Rychlý převod a stahování bez reklam</div>
        
        <div class="tabs">
            <div class="tab active" onclick="switchTab('audio')" id="tab-audio">MP3 (Audio)</div>
            <div class="tab" onclick="switchTab('video')" id="tab-video">MP4 (Video)</div>
        </div>

        <div class="form-group">
            <label for="url">Odkaz na YouTube video:</label>
            <input type="text" id="url" placeholder="https://www.youtube.com/watch?v=...">
        </div>

        <div class="form-group options active" id="opt-audio">
            <label for="audio-quality">Kvalita audia:</label>
            <select id="audio-quality">
                <option value="320">320 kbps (Nejvyšší)</option>
                <option value="256">256 kbps (Vysoká)</option>
                <option value="128">128 kbps (Standardní)</option>
            </select>
        </div>

        <div class="form-group options" id="opt-video">
            <label for="video-quality">Kvalita videa:</label>
            <select id="video-quality">
                <option value="max">Nejvyšší dostupná</option>
                <option value="1080">1080p (Full HD)</option>
                <option value="720">720p (HD)</option>
                <option value="480">480p (SD)</option>
            </select>
        </div>

        <button class="btn" id="submit-btn" onclick="startDownload()">Stáhnout soubor</button>
        <div id="status"></div>
    </div>

    <script>
        let currentMode = 'audio';

        function switchTab(mode) {
            currentMode = mode;
            document.getElementById('tab-audio').classList.toggle('active', mode === 'audio');
            document.getElementById('tab-video').classList.toggle('active', mode === 'video');
            document.getElementById('opt-audio').classList.toggle('active', mode === 'audio');
            document.getElementById('opt-video').classList.toggle('active', mode === 'video');
        }

        async function startDownload() {
            const urlInput = document.getElementById('url').value.trim();
            const status = document.getElementById('status');
            const btn = document.getElementById('submit-btn');

            if (!urlInput) {
                alert('Prosím zadej platný odkaz na YouTube video!');
                return;
            }

            btn.disabled = true;
            status.innerHTML = 'Zpracovávám požadavek...';

            const payload = {
                url: urlInput,
                downloadMode: currentMode === 'audio' ? 'audio' : 'auto',
                audioFormat: 'mp3',
                audioBitrate: document.getElementById('audio-quality').value,
                videoQuality: document.getElementById('video-quality').value
            };

            try {
                const response = await fetch('https://api.cobalt.tools/api/json', {
                    method: 'POST',
                    headers: {
                        'Accept': 'application/json',
                        'Content-Type': 'application/json',
                        'A-Client': 'web-app',
                        'Client-Version': '2.0'
                    },
                    body: JSON.stringify(payload)
                });

                const rawText = await response.text();
                let data;

                try {
                    data = JSON.parse(rawText);
                } catch (parseErr) {
                    throw new Error('Bezpečnostní ochrana serveru (Cloudflare) zablokovala přímý přístup z prohlížeče.');
                }

                if (!response.ok) {
                    throw new Error(data.text || 'Chyba při zpracování na serveru.');
                }

                if (data.status === 'redirect' || data.status === 'stream') {
                    status.innerHTML = 'Stahování zahájeno!';
                    window.location.href = data.url;
                    setTimeout(() => { btn.disabled = false; }, 3000);
                } else if (data.status === 'picker') {
                    status.innerHTML = 'Stahování zahájeno!';
                    window.location.href = data.picker[0].url;
                    setTimeout(() => { btn.disabled = false; }, 3000);
                } else {
                    throw new Error(data.text || 'Odkaz ke stažení nebyl vrácen.');
                }

            } catch (err) {
                status.innerHTML = `<span style="color: #ff4444;">${err.message}</span><br><br><small style="color: #aaa;">Poznámka: Bezpečnostní filtry API (Cloudflare) znemožňují přímá volání z klientského prohlížeče bez backendu. Pro 100% funkčnost bez reklam doporučuji spustit lokální Python skript (Flask + yt-dlp), který jsme řešili na začátku.</small>`;
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
